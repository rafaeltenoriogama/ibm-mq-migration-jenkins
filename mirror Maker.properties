# =========================================================
# CLUSTERS
# =========================================================

clusters=ruby-hom,expo-hom,ruby-dev


# =========================================================
# RUBY HOM - SOURCE
# =========================================================

ruby-hom.bootstrap.servers=bilhkaf004.dom101.intres:9094,melikaf051.dom101.intres:9094,melikaf047.dom101.intres:9094,melikaf049.dom101.intres:9094

# Mantenha aqui as configurações de security do ruby-hom
# que você já usa atualmente.
#
# Exemplo:
# ruby-hom.security.protocol=SASL_SSL
# ruby-hom.ssl.truststore.location=...
# ruby-hom.ssl.truststore.password=...
# ruby-hom.sasl.mechanism=SCRAM-SHA-512
# ruby-hom.sasl.jaas.config=...


# =========================================================
# RUBY DEV - TARGET
# =========================================================

ruby-dev.bootstrap.servers=melmkaf034.dom101.mapres:9094,melmkaf024.dom101.mapres:9094,melmkaf025.dom101.mapres:9094

ruby-dev.security.protocol=SASL_SSL
ruby-dev.ssl.truststore.location=/srv/tech/confluent/ssl/ALL_TEST_CA_CHAIN.truststore.jks
ruby-dev.ssl.truststore.password=SEU_PASSWORD

ruby-dev.sasl.mechanism=SCRAM-SHA-512
ruby-dev.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
  username="connect" \
  password="SEU_PASSWORD";


# =========================================================
# IMPORTANTE - NÃO RECODIFICAR A MENSAGEM
# =========================================================

key.converter=org.apache.kafka.connect.converters.ByteArrayConverter
value.converter=org.apache.kafka.connect.converters.ByteArrayConverter


# =========================================================
# MANTER EXATAMENTE O MESMO NOME DO TOPIC
# =========================================================

replication.policy.class=org.apache.kafka.connect.mirror.IdentityReplicationPolicy


# =========================================================
# RUBY HOM -> RUBY DEV
# =========================================================

ruby-hom->ruby-dev.enabled=true

ruby-hom->ruby-dev.topics=C3_H_CD_ER3_000091_CUSTOMERRELATIONSHIPADVISORTRACKED


# =========================================================
# PARA O TESTE, DESLIGAR COISAS QUE NÃO PRECISAMOS
# =========================================================

ruby-hom->ruby-dev.emit.heartbeats.enabled=false
ruby-hom->ruby-dev.emit.checkpoints.enabled=false

ruby-hom->ruby-dev.sync.topic.acls.enabled=false
ruby-hom->ruby-dev.sync.topic.configs.enabled=false

ruby-hom->ruby-dev.refresh.topics.enabled=true
ruby-hom->ruby-dev.refresh.topics.interval.seconds=10


# =========================================================
# TASKS / REPLICATION
# =========================================================

tasks.max=1

replication.factor=3

offset-syncs.topic.replication.factor=3
checkpoints.topic.replication.factor=3
heartbeats.topic.replication.factor=3


# Connect internal topics usados quando ruby-dev é target
ruby-dev.offset.storage.replication.factor=3
ruby-dev.status.storage.replication.factor=3
ruby-dev.config.storage.replication.factor=3