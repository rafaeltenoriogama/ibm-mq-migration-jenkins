# =========================================================
# Sem SSH, sem senha: o Ansible conversa direto com os
# containers via "docker exec" (plugin community.docker.docker).
# O nome do host aqui = nome do container no docker-compose.
# =========================================================

[mq_source]
OLD_SERVER1 ansible_connection=community.docker.docker 
OLD_SERVER2 ansible_connection=community.docker.docker 
OLD_SERVER3 ansible_connection=community.docker.docker 

[mq_target]
NEW_SERVER1 ansible_connection=community.docker.docker 
NEW_SERVER2 ansible_connection=community.docker.docker 
NEW_SERVER3 ansible_connection=community.docker.docker 

[mq_all:children]
mq_source
mq_target

[mq_all:vars]
# Evita depender de ~/.ansible/tmp (a home do mqm dentro do container
# pode não existir/ser gravável num "docker exec" não-interativo).
ansible_remote_tmp=/tmp/.ansible-mqm
