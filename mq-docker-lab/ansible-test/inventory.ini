# =========================================================
# Sem SSH, sem senha: o Ansible conversa direto com os
# containers via "docker exec" (plugin community.docker.docker).
# O nome do host aqui = nome do container no docker-compose.
# =========================================================

[mq_source]
melpmqs017 ansible_connection=community.docker.docker 
melpmqs018 ansible_connection=community.docker.docker 
melpmqs019 ansible_connection=community.docker.docker 
melpmqs020 ansible_connection=community.docker.docker 

[mq_target]
slpcfrbiwms6158 ansible_connection=community.docker.docker 
slpcfrbiwms9658 ansible_connection=community.docker.docker 
slpcfrbiwms4101 ansible_connection=community.docker.docker 
slpcfrbiwms5469 ansible_connection=community.docker.docker 

[mq_all:children]
mq_source
mq_target

[mq_all:vars]
# Evita depender de ~/.ansible/tmp (a home do mqm dentro do container
# pode não existir/ser gravável num "docker exec" não-interativo).
ansible_remote_tmp=/tmp/.ansible-mqm
