# =========================================================
# Laboratório de migração MQ - QM_PROD1, QM_PROD2, QM_PROD3
# Versão SIMPLES: usa a imagem oficial direto, sem Dockerfile
# customizado. O Ansible conecta via "docker exec" (plugin
# community.docker.docker), não via SSH - então não precisamos
# instalar nada dentro da imagem.
#
# ANTIGOS (com objetos já criados):
#   OLD_SERVER1 -> QM_PROD1
#   OLD_SERVER2 -> QM_PROD2
#   OLD_SERVER3 -> QM_PROD3
#
# NOVOS (vazios, prontos para receber a migração):
#   NEW_SERVER1 -> QM_PROD1 (destino)
#   NEW_SERVER2 -> QM_PROD2 (destino)
#   NEW_SERVER3 -> QM_PROD3 (destino)
# =========================================================

services:

  # ---------------- SERVIDORES ANTIGOS ----------------
  OLD_SERVER1:
    image: icr.io/ibm-messaging/mq:latest
    hostname: OLD_SERVER1
    container_name: OLD_SERVER1
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM_PROD1
    volumes:
      - ./mqsc-init/QM_PROD1_objects.mqsc:/etc/mqm/QM_PROD1_objects.mqsc:ro
    networks:
      - mqlab

  OLD_SERVER2:
    image: icr.io/ibm-messaging/mq:latest
    hostname: OLD_SERVER2
    container_name: OLD_SERVER2
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM_PROD2
    volumes:
      - ./mqsc-init/QM_PROD2_objects.mqsc:/etc/mqm/QM_PROD2_objects.mqsc:ro
    networks:
      - mqlab

  OLD_SERVER3:
    image: icr.io/ibm-messaging/mq:latest
    hostname: OLD_SERVER3
    container_name: OLD_SERVER3
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM_PROD3
    volumes:
      - ./mqsc-init/QM_PROD3_objects.mqsc:/etc/mqm/QM_PROD3_objects.mqsc:ro
    networks:
      - mqlab

  # ---------------- SERVIDORES NOVOS (vazios) ----------------
  NEW_SERVER1:
    image: icr.io/ibm-messaging/mq:latest
    hostname: NEW_SERVER1
    container_name: NEW_SERVER1
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM_PROD1
    networks:
      - mqlab

  NEW_SERVER2:
    image: icr.io/ibm-messaging/mq:latest
    hostname: NEW_SERVER2
    container_name: NEW_SERVER2
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM_PROD2
    networks:
      - mqlab

  NEW_SERVER3:
    image: icr.io/ibm-messaging/mq:latest
    hostname: NEW_SERVER3
    container_name: NEW_SERVER3
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM_PROD3
    networks:
      - mqlab

networks:
  mqlab:
    driver: bridge
